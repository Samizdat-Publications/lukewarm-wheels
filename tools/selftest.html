<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criss Cross Crash — self-test</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #14171d; color: #e8eaf0; font: 13px/1.5 system-ui, sans-serif; }
  header { padding: 14px 18px 6px; }
  h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .02em; }
  .sub { color: #8b93a3; font-size: 12px; }
  #out { margin: 8px 18px 24px; padding: 14px 16px; background: #0c0e12; border: 1px solid #2a2f3a; border-radius: 8px;
         font: 12px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/dist/rapier.mjs"
  }
}
</script>
</head>
<body>
<header>
  <h1>Criss Cross Crash — self-test</h1>
  <div class="sub">SPEC section 7. Results also on <code>window.__selftest = {passed, failed, results}</code>.</div>
</header>
<pre id="out">loading physics and renderer libs…</pre>

<!-- same files as src/manifest.json, same order (index.html inlines these via tools/build.mjs) -->
<script src="../src/00-namespace.js"></script>
<script src="../src/10-config.js"></script>
<script src="../src/20-catalog.js"></script>
<script src="../src/30-track-layout.js"></script>
<script src="../src/31-track-mesh.js"></script>
<script src="../src/40-electrical.js"></script>
<script src="../src/41-booster.js"></script>
<script src="../src/42-vehicle.js"></script>
<script src="../src/43-sim.js"></script>
<script src="../src/50-render-scene.js"></script>
<script src="../src/51-render-cars.js"></script>
<script src="../src/60-ui.js"></script>
<script src="../src/90-main.js"></script>

<script>
// Stop 90-main.js from booting: this page has no canvas and drives the fixed-step loop
// itself (the Browser pane throttles requestAnimationFrame, so measurements must be
// stepped synchronously). Classic scripts run before the deferred module below, so this
// lands before 90-main's hw:libs-ready handler fires.
HW.main.booted = true;
HW.main.paused = true;
</script>

<script>
(function (HW) {
  const V = HW.V, U = HW.units, H = 1 / HW.config.physicsHz;
  const out = document.getElementById('out');
  const results = [];
  let passed = 0, failed = 0, warned = 0;
  const lines = [];

  function write(s) { lines.push(s); out.textContent = lines.join('\n'); }
  function record(n, name, status, detail) {
    results.push({ n, name, status, detail });
    if (status === 'PASS') passed++; else if (status === 'FAIL') failed++; else warned++;
    write(status.padEnd(5) + ' ' + String(n).padStart(2) + '. ' + name.padEnd(30) + ' ' + detail);
  }
  const ok = (n, name, cond, detail) => record(n, name, cond ? 'PASS' : 'FAIL', detail);
  const f = (x, d = 3) => (Number.isFinite(x) ? x.toFixed(d) : String(x));
  const yieldToPage = () => new Promise((r) => setTimeout(r, 0));

  // Step the sim n times. `watch(i)` runs after each step; return false from it to stop early.
  // Returns the number of steps actually taken.
  async function stepFor(sim, n, watch) {
    for (let i = 0; i < n; i++) {
      sim.step(H);
      if (watch && watch(i) === false) return i + 1;
      if ((i & 1023) === 1023) await yieldToPage();
    }
    return n;
  }
  const finite = (p) => Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z);

  async function run() {
    lines.length = 0;
    write('Criss Cross Crash self-test — THREE r' + window.THREE.REVISION + ', RAPIER ' + window.RAPIER.version()
      + ', physics ' + (1 / H).toFixed(0) + ' Hz');
    write('');
    const cfg = HW.config;

    // ---- 1. both circuits close ------------------------------------------------
    let track;
    try {
      track = HW.track.build(cfg);
      const gaps = track.circuits.map((path) => {
        const segs = path.segments;
        const end = segs[segs.length - 1].pointAt(1);
        return { name: path.name, gap: V.dist(end, path.samples.P[0]), len: path.length };
      });
      const worst = Math.max(...gaps.map((g) => g.gap));
      ok(1, 'circuits close', worst < 0.05,
        gaps.map((g) => g.name + ' gap ' + f(g.gap, 4) + ' cm (len ' + f(g.len, 1) + ')').join(', ') + '  limit 0.05');
    } catch (e) { record(1, 'circuits close', 'FAIL', 'threw: ' + e.message); }

    // ---- 2. every lobe is a closed, tangent-continuous tilted circle -----------
    // The lobe solve (30-track-layout.js lobeGeom) derives the junction radius and the hub->chord
    // gap from lobeRadius + straightLen + tilt, so the two closure equations must hold exactly and
    // the three segments must meet in position AND heading.
    try {
      const K = Math.SQRT1_2, rows = [], errs = [];
      for (const arm of ['N', 'E', 'S', 'W']) {
        const g = HW.track.lobeGeom(arm, cfg);
        // closure: gap = rt sin b + S cos b ;  K*R - L = rt (1-cos b) + S sin b
        errs.push(Math.abs(g.gap - (g.rt * Math.sin(g.beta) + g.S * Math.cos(g.beta))));
        errs.push(Math.abs((K * g.R - cfg.laneOffset) - (g.rt * (1 - Math.cos(g.beta)) + g.S * Math.sin(g.beta))));
        // beta must be the plan angle of a tilted circle's end tangent
        errs.push(Math.abs(Math.tan(g.beta) - 1 / g.ct));
        const segs = track.lobes[arm].segs;
        errs.push(V.dist(segs[0].pointAt(1), segs[1].pointAt(0)));
        errs.push(V.dist(segs[1].pointAt(1), segs[2].pointAt(0)));
        // heading continuity at both joints
        const dir = (sg, u) => { const e = 1e-4, a2 = sg.pointAt(Math.min(1, u + e)), b2 = sg.pointAt(Math.max(0, u - e));
          const d2 = V.sub(a2, b2), l = V.len(d2) || 1; return { x: d2.x / l, y: d2.y / l, z: d2.z / l }; };
        errs.push(1 - V.dot(dir(segs[0], 1), dir(segs[1], 0)));
        errs.push(1 - V.dot(dir(segs[1], 1), dir(segs[2], 0)));
        rows.push(arm + ' tilt ' + f(U.radToDeg(g.tilt), 0) + ' rt ' + f(g.rt, 1) + ' gap ' + f(g.gap, 1) + ' apex ' + f(g.apex, 1));
      }
      const err = Math.max(...errs);
      ok(2, 'lobe closure + tangency', err < 2e-3, rows.join(' | ') + '  max err ' + err.toExponential(2) + ' limit 2e-3');
    } catch (e) { record(2, 'lobe closure + tangency', 'FAIL', 'threw: ' + e.message); }

    // ---- 3. booster zones sit on their lane ------------------------------------
    try {
      const bad = [];
      let worst = 0;
      for (const z of track.boosters) {
        const A = HW.track.ARMS[z.arm];
        // the wheel centre's lane point: booster radius out along the arm, offset into the lane
        const q = V.addScaled(V.scale(A.d, cfg.boosterR), A.r, z.lane === 'out' ? cfg.laneOffset : -cfg.laneOffset);
        const dist = V.dist(z.path.sample(z.s).p, q);
        if (dist > worst) worst = dist;
        if (dist >= 0.5) bad.push(z.name + ' ' + f(dist) + ' cm');
      }
      ok(3, 'booster zones on lane', bad.length === 0,
        track.boosters.length + ' zones, worst offset ' + f(worst, 4) + ' cm (limit 0.5)' + (bad.length ? ' — off: ' + bad.join(', ') : ''));
    } catch (e) { record(3, 'booster zones on lane', 'FAIL', 'threw: ' + e.message); }

    // ---- 4. electrical no-load rpm ---------------------------------------------
    let elec = null;
    try {
      elec = HW.electrical.create(cfg, track);
      elec.setSwitch(true);
      for (let i = 0; i < 480; i++) elec.step(H, 0);      // 2 s, no load
      const t = elec.telemetry(), target = elec.noLoadRpm();
      const rel = Math.abs(t.rpmMotor - target) / target;
      ok(4, 'no-load rpm', rel < 0.05,
        f(t.rpmMotor, 0) + ' rpm vs closed form ' + f(target, 0) + ' rpm (' + (rel * 100).toFixed(2) + '%, limit 5%), I=' + f(t.I, 3) + ' A');
    } catch (e) { record(4, 'no-load rpm', 'FAIL', 'threw: ' + e.message); }

    // ---- 5. battery sag under load ---------------------------------------------
    try {
      const before = elec.telemetry();
      for (let i = 0; i < 480; i++) elec.step(H, 3e5);    // 2 s at 3e5 dyne.cm on the wheels
      const after = elec.telemetry();
      const cond = after.I > before.I && after.V < after.V0 && after.V < before.V;
      ok(5, 'battery sag under load', cond,
        'I ' + f(before.I, 3) + ' -> ' + f(after.I, 3) + ' A, V ' + f(before.V, 3) + ' -> ' + f(after.V, 3)
        + ' V (open circuit ' + f(after.V0, 3) + '), rpm ' + f(before.rpmMotor, 0) + ' -> ' + f(after.rpmMotor, 0));
    } catch (e) { record(5, 'battery sag under load', 'FAIL', 'threw: ' + e.message); }

    // ---- 6. lone-car launch out of a nip ---------------------------------------
    const sim = HW.sim;
    let car = null, maxS = 0, launchOk = false;
    try {
      sim.create(cfg);
      sim.setSwitch(true);
      await stepFor(sim, 120);                            // 0.5 s spin-up
      car = sim.cars[0];
      car.spawnAtGate('N-out');
      let peak = 0, entered = false, exitSpeed = 0;
      const used = await stepFor(sim, Math.round(1 / H) * 3, () => {
        if (car.s > maxS) maxS = car.s;
        if (car.speed > peak) peak = car.speed;
        if (car.inBooster) entered = true;
        else if (entered) { exitSpeed = car.speed; return false; }
      });
      launchOk = entered && peak > 150 && peak < 600;
      ok(6, 'lone-car launch', launchOk,
        car.entry.name + ': peak ' + f(peak, 0) + ' cm/s (want 150-600), exit ' + f(exitSpeed, 0)
        + ' cm/s after ' + f(used * H, 2) + ' s' + (entered ? '' : ' — NEVER ENGAGED THE NIP'));
      window.__selftestLaunchSteps = used;
    } catch (e) { record(6, 'lone-car launch', 'FAIL', 'threw: ' + e.message); }

    // ---- 7. lone-car lap -- ENSEMBLE, not one run -------------------------------
    // A single run says nothing here: tools/chaos.mjs shows a 0.02 mm change of start position
    // swinging laps from 0 to 1. This check therefore runs every casting and passes if the FLEET
    // laps, reporting the spread. It still WARNs rather than fails: "a lone car circulates
    // indefinitely" (docs/REFERENCES.md) is the open behaviour target, not yet met.
    // autoRecycle is OFF for this check. It is a game affordance -- a car that stops is put back
    // into a nip -- and leaving it on would silently inflate the one number in this suite that has
    // been compared across every session of the project.
    const recycleWas = HW.config.autoRecycle;
    HW.config.autoRecycle = false;
    try {
      const SECS = 20;    // a lap takes ~2-3 s at speed, but a car spends a lot of it slow
      const perCar = [];
      for (let ci = 0; ci < sim.cars.length; ci++) {
        const c = sim.cars[ci];
        sim.reset(); sim.setSwitch(true);
        await stepFor(sim, Math.round(1 / H));
        c.spawnAtGate('N-out', ci * 0.09);
        let lifted = false, off = false, top = 0;
        await stepFor(sim, Math.round(1 / H) * SECS, () => {
          if (c.s > top) top = c.s;
          if (c.lifted) { lifted = true; return false; }
          if (c.offTrack) off = true;
        });
        perCar.push({ n: c.entry.name, laps: c.laps, maxS: top, lifted, off });
      }
      const lapped = perCar.filter((r) => r.laps >= 1).length;
      const best = Math.max(...perCar.map((r) => r.laps));
      const gone = perCar.filter((r) => r.lifted || r.off).length;
      const detail = perCar.map((r) => r.n + ' ' + r.laps + (r.lifted ? ' LIFTED' : r.off ? ' OFF' : '')).join(' | ')
        + '  (' + lapped + '/' + perCar.length + ' lapped in ' + SECS + ' s, best ' + best + ', ' + gone + ' left the track)';
      if (lapped >= 2) record(7, 'lone-car lap (fleet)', 'PASS', detail);
      else record(7, 'lone-car lap (fleet)', 'WARN', detail
        + '  -- open: the real toy circulates indefinitely, see HANDOFF "Next moves"');
    } catch (e) { record(7, 'lone-car lap (fleet)', 'FAIL', 'threw: ' + e.message); }
    HW.config.autoRecycle = recycleWas;

    // ---- 8. five cars: crashes, no NaN -----------------------------------------
    try {
      sim.reset();
      sim.setSwitch(true);
      await stepFor(sim, 120);
      const rpmFree = sim.elec.telemetry().rpmMotor;
      sim.lineUpFive();
      let rpmBog = Infinity, peak = 0;
      await stepFor(sim, Math.round(1 / H) * 15, () => {
        const r = sim.elec.telemetry().rpmMotor;
        if (r < rpmBog) rpmBog = r;
        for (const c of sim.cars) if (!c.lifted && c.speed > peak) peak = c.speed;
      });
      const nan = sim.cars.filter((c) => !finite(c.body.translation()));
      const lifted = sim.cars.filter((c) => c.lifted);
      const stalled = sim.cars.filter((c) => !c.lifted && c.stalled);
      const cond = sim.crashes >= 1 && nan.length === 0;
      record(8, 'five cars pile up' + (HW.config.autoRecycle ? ' (autoRecycle on)' : ''), cond ? 'PASS' : 'FAIL',
        sim.crashes + ' crashes in 15 s, ' + lifted.length + '/5 lifted (' + (lifted.map((c) => c.entry.name).join(', ') || 'none')
        + '), ' + stalled.length + ' stalled, ' + (nan.length ? 'NaN in: ' + nan.map((c) => c.entry.name).join(', ') : 'no NaN')
        + ', laps ' + sim.cars.map((c) => c.laps).join('/'));
      write('      motor ' + f(rpmFree, 0) + ' rpm free -> ' + f(rpmBog, 0) + ' rpm bogged under five nips; fastest car ' + f(peak, 0) + ' cm/s');
      write('      ' + sim.cars.map((c) => c.entry.name + ' ' + (c.lifted ? 'LIFTED'
        : (c.path ? c.path.name : '-') + ' s=' + f(c.s, 0) + ' v=' + f(c.speed, 0) + (c.stalled ? ' STALL' : '') + (c.offTrack ? ' OFF' : ''))).join(' | '));
      if (!cond && nan.length === 0) write('      root cause is upstream physics, not this harness: cars never reach the crossing (see check 7 / T18a, and T18 tuning).');
    } catch (e) { record(8, 'five cars pile up', 'FAIL', 'threw: ' + e.message); }

    write('');
    write('passed=' + passed + '  failed=' + failed + '  warned=' + warned);
    write(failed === 0 ? (warned ? 'SUITE OK (with warnings)' : 'SUITE OK') : 'SUITE FAILED');
    window.__selftest = { passed, failed, warned, results, text: lines.join('\n'), done: true };
  }

  function boot() {
    out.textContent = 'running…';
    run().catch((e) => {
      write('');
      write('SUITE CRASHED: ' + (e && e.stack || e));
      window.__selftest = { passed, failed: failed + 1, warned, results, text: lines.join('\n'), done: true, error: String(e) };
    });
  }
  addEventListener('hw:libs-ready', boot);
  if (window.THREE && window.RAPIER && window.__hwLibsReady) boot();
})(window.HW);
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import RAPIER from '@dimforge/rapier3d-compat';
  await RAPIER.init();
  window.THREE = THREE; window.RAPIER = RAPIER; window.OrbitControls = OrbitControls;
  window.__hwLibsReady = true;
  window.dispatchEvent(new CustomEvent('hw:libs-ready'));
</script>
</body>
</html>
