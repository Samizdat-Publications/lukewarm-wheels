<!doctype html>
<html lang="en">
<head>

<title>Criss Cross Crash</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1d24; color: #e8eaf0; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 12px; top: 12px; margin: 0; padding: 10px 12px; background: rgba(10,12,16,.72); border: 1px solid #333; border-radius: 8px; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; max-width: calc(100vw - 24px); overflow: hidden; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1a1d24; font-size: 16px; z-index: 10; }
  #loading.done { display: none; }
</style>
