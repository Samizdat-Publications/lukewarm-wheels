<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criss Cross Crash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0a1230;
    --panel: rgba(10, 17, 42, 0.80);
    --panel-2: rgba(19, 30, 66, 0.86);
    --line: rgba(160, 185, 255, 0.14);
    --text: #f4f1e8;
    --muted: #9aa7c8;
    --orange: #ff6a13;
    --orange-2: #ff8c3a;
    --flame: #ffc93c;
    --blue: #3b74ff;
    --crash: #ff3b2f;
    --good: #37d67a;
    --warn: #ffb020;
    --display: 'Racing Sans One', 'Arial Black', 'Impact', system-ui, sans-serif;
    --label: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --r: 12px;
    --gut: 16px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: #120c08; color: var(--text); font: 14px/1.4 var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #boot {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center;
    background: radial-gradient(120% 90% at 50% 40%, #2a1608 0%, #120a05 60%, #070403 100%);
    transition: opacity .6s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .logo { font: 400 clamp(38px, 9vw, 92px)/0.9 var(--display); color: var(--orange); transform: skewX(-8deg);
    text-shadow: 0 3px 0 #7a2400, 0 0 42px rgba(255,106,19,.35); letter-spacing: .01em; }
  #boot .logo span { color: var(--flame); }
  #boot .sub { margin-top: 14px; font: 600 15px var(--label); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  #boot .bar { width: min(320px, 70vw); height: 4px; margin: 26px auto 0; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 30%; background: linear-gradient(90deg, var(--orange), var(--flame)); border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
  #boot .err { max-width: 40em; margin: 22px auto 0; color: #ffb4a8; font: 500 14px/1.5 var(--body); white-space: pre-wrap; padding: 0 var(--gut); }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; } }

  /* ---------------------------------------------------------------- HUD */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .lbl { font: 600 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .num { font: 700 20px/1 var(--label); font-variant-numeric: tabular-nums; color: var(--flame); }
  .unit { font: 600 11px var(--label); color: var(--muted); letter-spacing: .06em; margin-left: 2px; }
  button { font: 700 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; cursor: pointer; transition: background .15s, border-color .15s, transform .08s; }
  button:hover { background: rgba(40, 60, 120, .9); border-color: rgba(160,185,255,.3); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, .seg button:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
  button.hot { background: linear-gradient(180deg, #ff7a24, #e8520a); border-color: #ff9a55; color: #1d0a00; }
  button.hot:hover { background: linear-gradient(180deg, #ff8c3a, #f05d12); }
  button[disabled] { opacity: .45; cursor: default; }

  #brand { position: absolute; left: calc(var(--gut) + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; }
  #brand .logo { font: 400 34px/0.9 var(--display); color: var(--orange); transform: skewX(-8deg); transform-origin: left bottom;
    text-shadow: 0 2px 0 #6b2000, 0 0 24px rgba(255,106,19,.3); }
  #brand .logo span { color: var(--flame); }
  #brand .tag { margin-top: 6px; font: 600 11px var(--label); letter-spacing: .2em; text-transform: uppercase; color: rgba(244,241,232,.7); text-shadow: 0 1px 2px rgba(0,0,0,.6); }

  #cambar { position: absolute; right: var(--gut); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; padding: 3px; gap: 2px; }
  .seg button { background: transparent; border: 0; border-radius: 8px; padding: 8px 11px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--orange); color: #1d0a00; }
  .seg button:hover:not([aria-pressed="true"]) { color: var(--text); background: rgba(255,255,255,.06); }
  .iconbtn { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; }
  .iconbtn svg { width: 18px; height: 18px; }

  #garage { position: absolute; right: var(--gut); top: calc(66px + env(safe-area-inset-top, 0px)); width: 272px; padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100% - 240px); overflow: auto; }
  #garage .head { display: flex; justify-content: space-between; align-items: baseline; }
  .carrow { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
  .carrow:hover { background: rgba(255,255,255,.04); border-color: var(--line); }
  .carrow.followed { border-color: rgba(255,201,60,.55); background: rgba(255,201,60,.07); }
  .carrow .thumb { width: 64px; height: 32px; }
  .carrow .name { font: 700 14px/1.1 var(--label); letter-spacing: .03em; }
  .carrow .meta { font: 500 11px/1.3 var(--label); color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; font: 700 10px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; padding: 3px 6px; border-radius: 99px; background: rgba(255,255,255,.08); color: var(--muted); }
  .chip.running { background: rgba(55,214,122,.16); color: var(--good); }
  .chip.crashed { background: rgba(255,59,47,.18); color: #ff7a70; }
  .chip.stalled { background: rgba(255,176,32,.16); color: var(--warn); }
  .chip.retrieving, .chip.incoming { background: rgba(59,116,255,.18); color: #9cb8ff; }
  .carrow .act { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; font-size: 16px; }

  #power { position: absolute; left: var(--gut); bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px)); padding: 12px 14px; display: grid; grid-template-columns: auto auto; gap: 12px 18px; align-items: center; }
  .switch { width: 94px; height: 44px; border-radius: 12px; background: #1a0b0b; border: 2px solid #3a1515; position: relative; cursor: pointer; padding: 0; }
  .switch::before { content: 'OFF'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font: 700 11px var(--label); color: #86505a; letter-spacing: .1em; }
  .switch::after { content: 'ON'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 700 11px var(--label); color: #86505a; letter-spacing: .1em; }
  .switch i { position: absolute; top: 4px; left: 4px; width: 42px; height: 32px; border-radius: 8px; background: linear-gradient(180deg, #d8dde6, #9aa2ae); box-shadow: 0 2px 0 #555c68, inset 0 1px 0 #fff; transition: left .18s cubic-bezier(.3,1.4,.5,1); }
  .switch[aria-checked="true"] { background: #2a0f06; border-color: var(--orange); box-shadow: 0 0 18px rgba(255,106,19,.35); }
  .switch[aria-checked="true"] i { left: 44px; }
  .switch[aria-checked="true"]::after { color: var(--flame); }
  .gauges { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 16px; }
  .gauge { min-width: 64px; }
  .gauge .bar { height: 4px; margin-top: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .gauge .bar i { display: block; height: 100%; width: 50%; background: linear-gradient(90deg, var(--orange), var(--flame)); border-radius: 3px; transition: width .12s linear; }
  #power .foot { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; }

  #actions { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; padding: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 2 * var(--gut)); }

  #speedo { position: absolute; right: var(--gut); bottom: calc(var(--gut) + env(safe-area-inset-bottom, 0px)); padding: 12px 16px; text-align: right; min-width: 190px; }
  #speedo .big { font: 800 italic 44px/0.95 var(--label); color: var(--text); font-variant-numeric: tabular-nums; }
  #speedo .big small { font-size: 16px; color: var(--muted); font-style: normal; margin-left: 4px; }
  #speedo .scale { font: 600 13px var(--label); color: var(--flame); letter-spacing: .05em; margin-top: 4px; font-variant-numeric: tabular-nums; }

  #toast { position: absolute; left: 50%; top: 13%; transform: translate(-50%, -50%) scale(.6) rotate(-6deg); opacity: 0; pointer-events: none; text-align: center; transition: opacity .18s, transform .25s cubic-bezier(.2,1.6,.4,1); }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-6deg); }
  #toast .word { font: 400 clamp(46px, 9vw, 96px)/0.9 var(--display); color: var(--flame); -webkit-text-stroke: 3px #7a1400; text-shadow: 0 5px 0 #7a1400, 0 0 40px rgba(255,59,47,.6); letter-spacing: .02em; }
  #toast .who { margin-top: 8px; font: 700 15px var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--text); text-shadow: 0 2px 6px rgba(0,0,0,.8); }

  #drawer { position: absolute; right: var(--gut); top: calc(66px + env(safe-area-inset-top, 0px)); width: 300px; max-height: calc(100% - 180px); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
  #drawer h3, #help h3 { margin: 0; font: 400 22px var(--display); color: var(--orange); transform: skewX(-6deg); }
  .field { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .field label { font: 600 12px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
  .field output { font: 700 13px var(--label); color: var(--flame); font-variant-numeric: tabular-nums; }
  .field .hint { grid-column: 1 / -1; font: 400 12px/1.35 var(--body); color: var(--muted); }
  .field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--orange); }
  .check { display: flex; gap: 10px; align-items: center; font: 600 13px var(--label); letter-spacing: .04em; }
  .check input { accent-color: var(--orange); width: 16px; height: 16px; }
  select { font: 600 13px var(--label); background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }

  #help { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100% - 2 * var(--gut))); max-height: calc(100% - 120px); overflow: auto; padding: 20px 22px; z-index: 6; }
  #help p, #help li { font: 400 14px/1.55 var(--body); color: #dfe3ee; max-width: 62ch; }
  #help ul { padding-left: 18px; margin: 8px 0; }
  #help b { color: var(--flame); font-weight: 600; }
  #help .close { position: absolute; right: 12px; top: 12px; }

  #hint { position: absolute; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 8px 14px; font: 600 12px var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--text); max-width: calc(100% - 2 * var(--gut)); text-align: center; }

  #replay-badge { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 8px 14px; cursor: pointer;
    font: 700 13px var(--label); letter-spacing: .16em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
  #replay-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--crash); box-shadow: 0 0 10px var(--crash); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #btn-replay.fresh { border-color: var(--flame); box-shadow: 0 0 0 1px var(--flame), 0 0 16px rgba(255,201,60,.35); }
  @media (max-width: 1180px) {
    #actions { left: var(--gut); transform: none; bottom: calc(var(--gut) + 128px + env(safe-area-inset-bottom, 0px)); max-width: 460px; justify-content: flex-start; }
    #actions button { padding: 8px 10px; }
  }
  @media (max-width: 900px) {
    #garage { width: 230px; }
    .carrow { grid-template-columns: 48px 1fr auto; }
    .carrow .thumb { width: 48px; height: 24px; }
  }
  @media (max-width: 720px) {
    :root { --gut: 10px; }
    #brand .logo { font-size: 24px; }
    #brand .tag, #hint { display: none; }
    #cambar .seg button { padding: 7px 7px; font-size: 11px; }
    #garage { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); right: var(--gut); left: var(--gut); width: auto; max-height: 30%; }
    #garage .carrow { grid-template-columns: 40px 1fr auto; padding: 5px; }
    #power { padding: 8px 10px; gap: 8px 12px; }
    .gauges { grid-template-columns: repeat(3, auto); gap: 2px 10px; }
    #speedo { display: none; }
    #actions { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
    #actions button { padding: 8px 9px; font-size: 11px; }
    #drawer { left: var(--gut); right: var(--gut); width: auto; }
  }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } .switch i { transition: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/dist/rapier.mjs"
  }
}
</script>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="Criss Cross Crash track set, 3D view"></canvas>
<div id="ui"></div>
<div id="boot" role="status" aria-live="polite">
  <div>
    <div class="logo">Criss Cross <span>Crash</span></div>
    <div class="sub">Warming up the booster</div>
    <div class="bar"><i></i></div>
    <div class="err" id="boot-err" hidden></div>
  </div>
</div>

<!-- If the module below never runs (a host blocking the CDN, or WebAssembly disallowed),
     say so instead of spinning forever. A classic script can watch from outside. -->
<script>
  window.__hwBootErr = null;
  addEventListener('error', function (e) { if (!window.__hwBootErr) window.__hwBootErr = e.message || String(e.error || ''); }, true);
  setTimeout(function () {
    if (window.__hwLibsReady) return;
    var el = document.getElementById('boot-err');
    if (!el) return;
    el.hidden = false;
    el.textContent = 'three.js or the Rapier physics engine did not load. This page pulls both from cdn.jsdelivr.net and compiles a small WebAssembly module; one of the two is blocked here.' + (window.__hwBootErr ? '\n\n' + window.__hwBootErr : '');
  }, 15000);
</script>

<!-- HW:SCRIPTS (tools/build.mjs inlines src/manifest.json here, in order) -->
<script src="src/00-core.js"></script>
<script src="src/10-config.js"></script>
<script src="src/20-catalog.js"></script>
<script src="src/30-track-path.js"></script>
<script src="src/31-track-layout.js"></script>
<script src="src/40-power.js"></script>
<script src="src/41-cars.js"></script>
<script src="src/42-collide.js"></script>
<script src="src/43-freebody.js"></script>
<script src="src/45-sim.js"></script>
<script src="src/50-render-core.js"></script>
<script src="src/51-render-world.js"></script>
<script src="src/52-render-track.js"></script>
<script src="src/53-car-models.js"></script>
<script src="src/54-render-hub.js"></script>
<script src="src/55-render-cars.js"></script>
<script src="src/56-camera.js"></script>
<script src="src/57-fx.js"></script>
<script src="src/60-audio.js"></script>
<script src="src/61-audio-assets.js"></script>
<script src="src/70-ui.js"></script>
<script src="src/90-main.js"></script>
<!-- /HW:SCRIPTS -->

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
  import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
  import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
  import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
  import RAPIER from '@dimforge/rapier3d-compat';
  try {
    await RAPIER.init();
  } catch (e) { window.__hwBootErr = 'Rapier failed to initialise: ' + (e && e.message || e); }
  window.THREE = THREE;
  window.THREEX = { OrbitControls, RoomEnvironment, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, ShaderPass, GTAOPass, BokehPass, mergeGeometries, mergeVertices, RoundedBoxGeometry };
  window.RAPIER = RAPIER;
  window.__hwLibsReady = true;
  window.dispatchEvent(new CustomEvent('hw:libs-ready'));
</script>
</body>
</html>
